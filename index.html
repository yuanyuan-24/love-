<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>情侣轻暧昧大冒险转盘</title>
<style>
:root{--bg1:#fff0f5;--bg2:#ffd9e6;--card:#ffffff;--text:#6b2a47;--sub:#a5607f;--main:#ff6f9f;--main2:#ff9ec0;--line:#ffc2d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1420;--bg2:#3d1b2e;--card:#3a2030;--text:#ffe3ee;--sub:#e6a3bf;--main:#ff6f9f;--main2:#d94f80;--line:#6a3550}}
:root[data-theme="dark"]{--bg1:#2a1420;--bg2:#3d1b2e;--card:#3a2030;--text:#ffe3ee;--sub:#e6a3bf;--main:#ff6f9f;--main2:#d94f80;--line:#6a3550}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px 14px 40px}
h1{font-size:22px;margin:8px 0 2px}
.sub{color:var(--sub);font-size:13px;margin-bottom:14px}
.players{display:flex;gap:8px;width:100%;max-width:380px;margin-bottom:14px}
.p{flex:1;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 10px;text-align:center;transition:.25s}
.p.on{border-color:var(--main);box-shadow:0 4px 14px rgba(255,111,159,.35);transform:translateY(-2px)}
.p small{display:block;font-size:11px;color:var(--sub)}
.p input{width:100%;border:0;background:transparent;text-align:center;font-size:16px;font-weight:700;color:var(--text);outline:none}
.wrap{position:relative;width:min(86vw,340px);aspect-ratio:1;margin:6px 0 12px}
.wrap canvas{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 8px 28px rgba(255,111,159,.4);transition:transform 4.2s cubic-bezier(.12,.6,.1,1)}
.ptr{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:26px solid var(--main);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));z-index:2}
.go{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:linear-gradient(135deg,var(--main2),var(--main));color:#fff;font-size:18px;font-weight:800;z-index:2;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer}
.go:disabled{opacity:.7}
.prog{font-size:13px;color:var(--sub);margin-bottom:12px}
.btn{border:0;border-radius:999px;padding:10px 20px;font-size:15px;font-weight:700;cursor:pointer;background:var(--main);color:#fff}
.btn.ghost{background:var(--card);color:var(--main);border:2px solid var(--line)}
.mask{position:fixed;inset:0;background:rgba(80,20,50,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.mask.show{display:flex}
.modal{background:var(--card);border-radius:24px;padding:24px 20px;width:100%;max-width:360px;text-align:center}
.badge{display:inline-block;padding:4px 14px;border-radius:999px;color:#fff;font-weight:800;font-size:14px;margin-bottom:10px}
.who{font-size:13px;color:var(--sub);margin-bottom:8px}
.q{font-size:22px;font-weight:800;line-height:1.5;margin:8px 0 12px;word-break:break-word}
.tip{font-size:12px;color:var(--sub);margin-bottom:18px}
.row{display:flex;gap:10px;justify-content:center}
.panel{background:var(--card);border-radius:20px;padding:16px;width:100%;max-width:380px;margin-top:14px;display:none}
.panel.show{display:block}
.panel h3{margin:10px 0 8px;font-size:15px}
.panel h3:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.chip{border:2px solid var(--line);background:transparent;color:var(--sub);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{color:#fff;border-color:transparent}
.add{display:flex;gap:6px;margin-bottom:8px}
.add select,.add input,textarea,.sr input,.sr select{border:2px solid var(--line);border-radius:12px;padding:8px;font-size:14px;background:transparent;color:var(--text);font-family:inherit}
.add input,.sr input{flex:1;min-width:0}
.sr{display:flex;gap:6px}
textarea{width:100%;height:76px;margin:4px 0 8px;resize:vertical}
.list{max-height:260px;overflow:auto;border-top:1px solid var(--line);margin-top:8px}
.it{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.it span.t{flex:1;word-break:break-all}
.tag{font-size:11px;color:#fff;border-radius:8px;padding:1px 7px;white-space:nowrap}
.x{border:0;background:transparent;color:var(--sub);font-size:18px;cursor:pointer}
.hint{font-size:12px;color:var(--sub);margin-top:4px}
.toast{position:fixed;bottom:calc(30px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--main);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<h1>💗 情侣轻暧昧大冒险 💗</h1>
<div class="sub">转一转，抽一个甜甜的小任务</div>

<div class="players">
  <div class="p on" id="p0"><small>玩家 1</small><input id="n0" maxlength="8" value="我"></div>
  <div class="p" id="p1"><small>玩家 2</small><input id="n1" maxlength="8" value="她"></div>
</div>

<div class="wrap">
  <div class="ptr"></div>
  <canvas id="cv"></canvas>
  <button class="go" id="go">转！</button>
</div>
<div class="prog" id="prog"></div>

<button class="btn ghost" id="mg">管理题目</button>

<div class="panel" id="panel">
  <h3>参与转盘的类别</h3>
  <div class="chips" id="chips"></div>
  <h3>添加题目</h3>
  <div class="add">
    <select id="ty"></select>
    <input id="tx" placeholder="输入一道题">
    <button class="btn" id="ad" style="padding:8px 14px">加</button>
  </div>
  <textarea id="bulk" placeholder="批量添加：一行一题&#10;行首可写“亲吻：”“拥抱：”等指定类别"></textarea>
  <button class="btn" id="bd" style="padding:8px 16px">批量添加</button>
  <h3>题库</h3>
  <div class="sr"><input id="sq" placeholder="搜索题目"><select id="sc"></select></div>
  <div class="hint" id="cnt"></div>
  <div class="list" id="list"></div>
  <div style="margin-top:12px"><button class="btn ghost" id="rs" style="padding:8px 16px;font-size:13px">恢复默认题库</button></div>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <div class="who" id="who"></div>
    <div class="badge" id="bg"></div>
    <div class="q" id="q"></div>
    <div class="tip">完成后互相说一句：我更喜欢你了 💕</div>
    <div class="row">
      <button class="btn ghost" id="re">换一题</button>
      <button class="btn" id="ok">完成 💕</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

function load(){
  try{var s=JSON.parse(localStorage.getItem("tdw2")||"null");
    if(s){added=s.a||[];(s.d||[]).forEach(function(i){del[i]=1});if(s.e&&s.e.length===CATS.length)en=s.e;if(s.n){$("n0").value=s.n[0];$("n1").value=s.n[1];}}
  }catch(e){}
}
function save(){try{localStorage.setItem("tdw2",JSON.stringify({a:added,d:Object.keys(del).map(Number),e:en,n:[$("n0").value,$("n1").value]}));}catch(e){}}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},1800)}
function name(i){return ($("n"+i).value||("玩家"+(i+1))).trim()}
function items(){
  var o=[];DATA.forEach(function(a,i){if(!del[i])o.push({id:"d"+i,c:a[0],x:a[1],di:i})});
  added.forEach(function(a,i){o.push({id:"a"+i,c:a[0],x:a[1],ai:i})});return o;
}
function active(){var all=items();return CATS.map(function(_,k){return k}).filter(function(k){return en[k]&&all.some(function(o){return o.c===k})});}

var cv=$("cv"),ctx=cv.getContext("2d");
function draw(){
  var act=active(),size=cv.clientWidth||300,dpr=window.devicePixelRatio||1;
  cv.width=size*dpr;cv.height=size*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  var r=size/2;ctx.clearRect(0,0,size,size);
  if(!act.length){ctx.beginPath();ctx.arc(r,r,r-4,0,Math.PI*2);ctx.fillStyle="#ffb3cc";ctx.fill();return;}
  var a=Math.PI*2/act.length;
  act.forEach(function(k,i){
    var s=-Math.PI/2+i*a;
    ctx.beginPath();ctx.moveTo(r,r);ctx.arc(r,r,r-4,s,s+a);ctx.closePath();
    ctx.fillStyle=CATS[k].c;ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.stroke();
    ctx.save();ctx.translate(r,r);ctx.rotate(act.length===1?0:s+a/2);ctx.textAlign="right";ctx.fillStyle="#fff";
    ctx.font="800 "+Math.round(size*0.055)+"px sans-serif";ctx.fillText(CATS[k].e+" "+CATS[k].n,act.length===1?r*.6:r-20,size*0.02);
    ctx.restore();
  });
  ctx.beginPath();ctx.arc(r,r,r-4,0,Math.PI*2);ctx.lineWidth=6;ctx.strokeStyle="#fff";ctx.stroke();
}
function progress(){
  var all=items().filter(function(o){return en[o.c]}),u=all.filter(function(o){return used[o.id]}).length;
  $("prog").textContent="已抽 "+u+" / "+all.length+" 条";
}
function pick(k){
  var pool=items().filter(function(o){return o.c===k});
  if(!pool.length)return null;
  var left=pool.filter(function(o){return !used[o.id]});
  if(!left.length){pool.forEach(function(o){delete used[o.id]});left=pool;toast("这一类抽完啦，重新洗牌");}
  var c=left[Math.floor(Math.random()*left.length)];used[c.id]=1;progress();return c;
}
function show(k){
  var q=pick(k);if(!q){toast("这一类还没有题");return false;}
  cur=k;$("who").textContent="轮到 "+name(turn)+" 💗";
  var b=$("bg");b.textContent=CATS[k].e+" "+CATS[k].n;b.style.background=CATS[k].c;
  $("q").textContent=q.x;$("mask").classList.add("show");return true;
}
function spin(){
  if(spinning)return;
  var act=active();if(!act.length){toast("请先在管理题目里选择类别");return;}
  spinning=true;$("go").disabled=true;
  var i=Math.floor(Math.random()*act.length),a=360/act.length;
  var center=i*a+a/2+(Math.random()-.5)*a*.6;
  var base=rot%360,need=((360-center)-base+360)%360;
  rot=rot+360*5+need;cv.style.transform="rotate("+rot+"deg)";
  setTimeout(function(){spinning=false;$("go").disabled=false;show(act[i]);},4300);
}
function setTurn(){$("p0").classList.toggle("on",turn===0);$("p1").classList.toggle("on",turn===1);}

function buildPanel(){
  var ch=$("chips"),ty=$("ty"),sc=$("sc");ch.innerHTML="";ty.innerHTML='<option value="-1">自动识别</option>';sc.innerHTML='<option value="-1">全部类别</option>';
  CATS.forEach(function(c,k){
    var b=document.createElement("button");b.className="chip"+(en[k]?" on":"");b.textContent=c.e+" "+c.n;if(en[k])b.style.background=c.c;
    b.onclick=function(){
      if(en[k]&&en.filter(Boolean).length===1){toast("至少保留一个类别");return;}
      en[k]=!en[k];save();buildPanel();draw();progress();
    };ch.appendChild(b);
    ty.insertAdjacentHTML("beforeend",'<option value="'+k+'">'+c.n+'</option>');
    sc.insertAdjacentHTML("beforeend",'<option value="'+k+'">'+c.n+'</option>');
  });
}
function renderList(){
  var q=$("sq").value.trim(),k=+$("sc").value,all=items().filter(function(o){return (k<0||o.c===k)&&(!q||o.x.indexOf(q)>=0)});
  $("cnt").textContent="共 "+all.length+" 条"+(all.length>60?"，只显示前 60 条，可搜索缩小范围":"");
  var l=$("list");l.innerHTML="";
  all.slice(0,60).forEach(function(o){
    var d=document.createElement("div");d.className="it";
    var g=document.createElement("span");g.className="tag";g.textContent=CATS[o.c].n;g.style.background=CATS[o.c].c;
    var t=document.createElement("span");t.className="t";t.textContent=o.x;
    var x=document.createElement("button");x.className="x";x.textContent="×";
    x.onclick=function(){
      if(o.ai!==undefined){added.splice(o.ai,1);}else{del[o.di]=1;}
      used={};save();refresh();
    };
    d.appendChild(g);d.appendChild(t);d.appendChild(x);l.appendChild(d);
  });
}
function refresh(){draw();progress();renderList();}
function addOne(c,x){x=(x||"").trim();if(!x)return false;added.push([c<0?classify(x):c,x]);return true;}

$("go").onclick=spin;
$("ok").onclick=function(){$("mask").classList.remove("show");turn=1-turn;setTurn();};
$("re").onclick=function(){show(cur);};
$("mg").onclick=function(){$("panel").classList.toggle("show");};
$("ad").onclick=function(){if(addOne(+$("ty").value,$("tx").value)){$("tx").value="";save();refresh();toast("已添加");}};
$("bd").onclick=function(){
  var n=0;$("bulk").value.split("\n").forEach(function(line){
    line=line.trim();if(!line)return;var c=+$("ty").value,m=line.match(/^(亲吻|拥抱|牵手|对视|情话|小互动)\s*[:：]\s*(.*)$/);
    if(m){c=CATS.map(function(x){return x.n}).indexOf(m[1]);line=m[2];}
    if(addOne(c,line))n++;
  });
  $("bulk").value="";save();refresh();toast("添加了 "+n+" 道");
};
$("rs").onclick=function(){if(confirm("恢复默认题库？你添加和删除的内容都会还原。")){added=[];del={};used={};save();refresh();toast("已恢复");}};
$("sq").oninput=renderList;$("sc").onchange=renderList;
$("n0").oninput=$("n1").oninput=save;
window.addEventListener("resize",draw);
load();buildPanel();refresh();setTurn();
})();
</script>
</body>
</html>
