<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我们的小宇宙</title>
<style>
:root{--bg:#14163a;--ink:#f1eefb;--dim:#a9a5cf;--rose:#f2a7b8;--gold:#ffd97a;--card:#1f2257;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#14163a}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif SC","Songti SC",Georgia,serif;line-height:1.7}
#sky{position:fixed;inset:0;z-index:0;width:100%;height:100%}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 20px 80px}
section{padding:56px 0 8px}
h1{font-size:2rem;margin:0 0 6px;font-weight:700;letter-spacing:.04em}
h2{font-size:1.25rem;margin:0 0 14px;color:var(--rose)}
.hero{text-align:center;padding-top:72px}
.days{font-size:5.5rem;line-height:1;color:var(--gold);font-weight:700;margin:18px 0 4px}
.sub{color:var(--dim);margin:0}
.set{margin-top:22px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
input[type=text],input[type=date]{background:var(--card);border:1px solid #3a3e85;color:var(--ink);padding:9px 12px;border-radius:10px;font:inherit;font-size:.95rem;max-width:150px}
button,.btn{background:var(--rose);color:#2a1630;border:0;padding:10px 18px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wall{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:16px}
.pol{background:#f6f2ea;padding:8px 8px 26px;border-radius:3px;transform:rotate(var(--r));box-shadow:0 8px 20px #0007}
.pol img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.empty{color:var(--dim);font-size:.95rem}
#game{position:relative;height:300px;background:#0e1030;border-radius:16px;overflow:hidden;margin-top:12px;touch-action:manipulation}
.star{position:absolute;font-size:30px;line-height:1;background:none;border:0;padding:4px;color:var(--gold);cursor:pointer}
#score{color:var(--gold);font-weight:700}
.msg{margin-top:12px;color:var(--dim)}
.note{background:var(--card);border-radius:14px;padding:12px 14px;margin-top:10px}
.note small{color:var(--dim)}
.note p{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
textarea{width:100%;background:var(--card);border:1px solid #3a3e85;color:var(--ink);padding:10px 12px;border-radius:10px;font:inherit;min-height:84px}
.hide{display:none!important}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.card{aspect-ratio:1;border-radius:12px;background:var(--card);border:1px solid #3a3e85;font-size:1.8rem;color:var(--ink);padding:0;cursor:pointer}
.card.up{background:#f6f2ea}
.card.ok{background:var(--rose)}
.draw{margin-top:12px;background:var(--card);border-radius:14px;padding:16px;min-height:64px}
footer{text-align:center;color:var(--dim);padding:48px 0 0;font-size:.9rem}
@media (prefers-reduced-motion:reduce){.star{transition:none}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main>
<section class="hero">
  <h1 id="title">我们的小宇宙</h1>
  <p class="sub" id="line">从遇见你那天起，已经过去了</p>
  <div class="days" id="days">0</div>
  <p class="sub">天</p>
  <div class="set">
    <input type="text" id="who" placeholder="她的名字" aria-label="她的名字">
    <input type="date" id="start" aria-label="在一起的日期">
    <button id="save">保存</button>
  </div>
</section>

<section>
  <h2>照片墙</h2>
  <label class="btn" for="pick">添加照片</label>
  <input type="file" id="pick" accept="image/*" multiple hidden>
  <div class="wall" id="wall"></div>
  <p class="empty" id="empty">还没有照片。照片只保存在这台设备的浏览器里。</p>
</section>

<section>
  <h2>悄悄话</h2>
  <textarea id="txt" maxlength="300" placeholder="写一句只给我们看的话" aria-label="悄悄话"></textarea>
  <div class="set" style="justify-content:flex-end"><input type="text" id="from" placeholder="署名" aria-label="署名" style="max-width:110px"><button id="send">留下</button></div>
  <div id="notes"></div>
  <p class="empty" id="nempty">还没有悄悄话，写下第一句吧。</p>
</section>

<section>
  <h2>接住星星</h2>
  <p class="sub">每颗星星都是一句不同的话，不会重复。已接住 <span id="score">0</span> 颗</p>
  <div id="game"></div>
  <p class="msg" id="msg">点一颗星星试试。</p>
  <div class="set" style="justify-content:flex-start"><input type="text" id="mine" placeholder="加一句你想说的话" aria-label="新增星星的话" style="max-width:none;flex:1"><button id="addw">加入</button></div>
</section>

<section>
  <h2>翻牌配对</h2>
  <p class="sub">找出 6 对一样的图案。步数 <span id="moves">0</span></p>
  <div class="cards" id="cards"></div>
  <p class="msg" id="fmsg"></p>
  <button id="again" style="margin-top:8px">重新洗牌</button>
</section>

<section>
  <h2>约定卡</h2>
  <p class="sub">抽一张，今天就照着做。</p>
  <div class="draw" id="draw">点下面的按钮抽一张。</div>
  <button id="pull" style="margin-top:10px">抽一张</button>
</section>

<footer>这个世界只围着一个人转。</footer>
</main>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  // sky
  var c=$('sky'),x=c.getContext('2d'),S=[];
  function size(){c.width=innerWidth;c.height=innerHeight;S=[];for(var i=0;i<90;i++)S.push([Math.random()*c.width,Math.random()*c.height,Math.random()*1.4+.3,Math.random()*6])}
  function draw(t){x.clearRect(0,0,c.width,c.height);for(var i=0;i<S.length;i++){var s=S[i];x.globalAlpha=.4+.5*Math.sin(t/900+s[3]);x.fillStyle='#fff';x.beginPath();x.arc(s[0],s[1],s[2],0,7);x.fill()}requestAnimationFrame(draw)}
  size();addEventListener('resize',size);
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches)requestAnimationFrame(draw);else draw(0);

  // countdown (localStorage)
  var cfg={};
  function ld(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
  function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  cfg=ld('love',{});
  function render(){
    if(cfg.who)$('title').textContent='给'+cfg.who+'的小宇宙';
    if(cfg.start){
      var d=Math.floor((Date.now()-new Date(cfg.start+'T00:00:00').getTime())/864e5);
      $('days').textContent=Math.max(d,0);
      $('line').textContent='从在一起那天起，已经过去了';
    }
    $('who').value=cfg.who||'';$('start').value=cfg.start||'';
  }
  $('save').onclick=function(){cfg={who:$('who').value.trim(),start:$('start').value};sv('love',cfg);render()};
  render();

  // photos (IndexedDB, compressed)
  var idb;
  var rq=indexedDB.open('love-universe',1);
  rq.onupgradeneeded=function(){rq.result.createObjectStore('photos',{keyPath:'id'})};
  rq.onsuccess=function(){idb=rq.result;showPhotos()};
  rq.onerror=function(){$('empty').textContent='这个浏览器不允许保存照片（可能是隐私模式）。'};
  function showPhotos(){
    var w=$('wall');w.innerHTML='';
    idb.transaction('photos').objectStore('photos').getAll().onsuccess=function(e){
      var list=e.target.result.sort(function(a,b){return b.id-a.id});
      list.forEach(function(p,i){
        var d=document.createElement('div');d.className='pol';
        d.style.setProperty('--r',(((i*37)%9)-4)+'deg');
        var im=new Image();im.src=URL.createObjectURL(p.blob);im.alt='合照';d.appendChild(im);w.appendChild(d);
      });
      $('empty').style.display=list.length?'none':'';
    };
  }
  function shrink(f){return new Promise(function(res,rej){
    var im=new Image(),u=URL.createObjectURL(f);
    im.onload=function(){var k=Math.min(1,1200/Math.max(im.width,im.height)),cv=document.createElement('canvas');
      cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      URL.revokeObjectURL(u);cv.toBlob(function(b){b?res(b):rej()},'image/jpeg',.85)};
    im.onerror=rej;im.src=u})}
  $('pick').onchange=async function(e){
    if(!idb)return;
    for(var f of Array.from(e.target.files)){
      try{var b=await shrink(f);
        await new Promise(function(ok,no){var t=idb.transaction('photos','readwrite');t.objectStore('photos').put({id:Date.now()+Math.floor(Math.random()*1000),blob:b});t.oncomplete=ok;t.onerror=no});
      }catch(err){}
    }
    e.target.value='';showPhotos();
  };
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

  // notes (localStorage)
  function showNotes(){
    var l=ld('notes',[]).slice().reverse(),w=$('notes');w.innerHTML='';
    l.forEach(function(n){
      var e=document.createElement('div');e.className='note';e.innerHTML='<small></small><p></p>';
      e.querySelector('small').textContent=(n.from||'匿名')+' · '+new Date(n.t).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
      e.querySelector('p').textContent=n.text;w.appendChild(e);
    });
    $('nempty').style.display=l.length?'none':'';
  }
  $('send').onclick=function(){
    var t=$('txt').value.trim();if(!t)return;
    var l=ld('notes',[]);l.push({text:t,from:$('from').value.trim(),t:Date.now()});sv('notes',l);$('txt').value='';showNotes();
  };
  showNotes();

  // game: every star is a different line, never repeated
  var g=$('game'),n=0;
  var base=['遇见你之后，普通的日子都发光了。','想把所有好运都分给你。','你笑的时候，我这边也晴了。','今天也比昨天更喜欢你一点。','和你在一起，连等红灯都不无聊。','你不用很完美，你是你就够了。','有你的地方，就是我的方向。','我的小宇宙里，最亮的是你。','你说的废话，我也愿意听很久。','我喜欢你认真吃饭的样子。','你难过的时候，我就在旁边。','想和你把平凡的日子过成纪念日。','你是我今天最想见的人。','愿你每天都有一点小开心。','和你说晚安，是我一天最好的结尾。','不用赶路，我陪你慢慢走。','你的名字，我写了很多遍也不腻。','被你喜欢，是我最大的运气。','我把今天的月亮留给你了。','你一出现，我的心情就自动变好。'];
  var A=['看到好看的晚霞','吃到好吃的东西','走在人多的街上','下雨的时候','听到喜欢的歌','清晨醒来','深夜睡不着','路过花店','收到你的消息','一个人发呆','遇到有趣的事','坐在回家的车上','看到可爱的小猫','天气突然变冷','拿到一份惊喜','翻到旧照片','闻到熟悉的味道','抬头看见月亮','累得不想说话','走过我们去过的地方','喝到热乎乎的奶茶','看见两个人牵手','天空放晴','听到有人叫你的名字'];
  var B=['第一个想分享的人就是你','我都会悄悄想起你','都觉得有你真好','心里都软软的','嘴角会不自觉上扬','我都想对你说声谢谢','就想马上告诉你','我都想把你抱紧一点','我都觉得这个世界很温柔','脑子里全是你','我都在心里说一句喜欢你','就特别想和你一起','都忍不住笑出来','我就更舍不得你','都想着下次一起来','我都觉得自己很幸运','就觉得一切都值得','我都在想你现在在做什么','都想把这一刻留给你','我知道自己有多喜欢你'];
  var seen=ld('seen',[]),seenSet={};seen.forEach(function(i){seenSet[i]=1});
  function pool(){var U=ld('words',[]);return {U:U,total:base.length+A.length*B.length+U.length}}
  function textAt(i,U){
    if(i<base.length)return base[i];
    i-=base.length;
    if(i<A.length*B.length)return A[Math.floor(i/B.length)]+'，'+B[i%B.length]+'。';
    return U[i-A.length*B.length];
  }
  function nextLine(){
    var p=pool(),note='';
    if(seen.length>=p.total){seen=[];seenSet={};note='（所有的话都收齐了，从头再来一轮）'}
    var i;do{i=Math.floor(Math.random()*p.total)}while(seenSet[i]);
    seen.push(i);seenSet[i]=1;sv('seen',seen);
    return textAt(i,p.U)+note;
  }
  $('addw').onclick=function(){var t=$('mine').value.trim();if(!t)return;var w=ld('words',[]);w.push(t);sv('words',w);$('mine').value='';$('msg').textContent='已加入，它也会变成一颗星星。'};
  function spawn(){
    var b=document.createElement('button');b.className='star';b.textContent='★';b.setAttribute('aria-label','星星');
    var w=Math.max(g.clientWidth-40,10);b.style.left=Math.random()*w+'px';b.style.top='-40px';
    b.style.transition='top '+(4+Math.random()*2)+'s linear';
    g.appendChild(b);
    requestAnimationFrame(function(){requestAnimationFrame(function(){b.style.top=g.clientHeight+'px'})});
    b.onclick=function(){b.remove();n++;$('score').textContent=n;$('msg').textContent=nextLine()};
    setTimeout(function(){b.remove()},6500);
  }

  // memory flip
  var icons=['🌙','⭐','🌸','🍓','🎧','🐱'],first=null,lock=false,mv=0,pairs=0;
  function deal(){
    var d=icons.concat(icons).sort(function(){return Math.random()-.5}),box=$('cards');
    box.innerHTML='';first=null;lock=false;mv=0;pairs=0;$('moves').textContent=0;$('fmsg').textContent='';
    d.forEach(function(ic){
      var c=document.createElement('button');c.className='card';c.setAttribute('aria-label','牌');
      c.onclick=function(){
        if(lock||c.classList.contains('up')||c.classList.contains('ok'))return;
        c.classList.add('up');c.textContent=ic;
        if(!first){first=c;return}
        mv++;$('moves').textContent=mv;
        if(first.textContent===ic){first.classList.add('ok');c.classList.add('ok');first=null;pairs++;
          if(pairs===6)$('fmsg').textContent='全配对成功，用了 '+mv+' 步。我们也是天生一对。'}
        else{lock=true;var f=first;first=null;setTimeout(function(){f.classList.remove('up');c.classList.remove('up');f.textContent='';c.textContent='';lock=false},700)}
      };
      box.appendChild(c);
    });
  }
  $('again').onclick=deal;deal();

  // promise cards, no repeat until all drawn
  var proms=['今晚视频十分钟，什么都不用做，只是看着对方。','给对方发一张今天看到的最好看的东西。','说出三件今天让你开心的小事。','一起选一部电影，周末看。','互相夸对方三个优点。','下次见面，带一份对方爱吃的小零食。','今天早点睡，说一句晚安再睡。','写一句话，留在悄悄话里。','约定下一次一起去的地方。','分享一首最近一直在听的歌。','互相讲一件小时候的糗事。','今天认真说一次“我想你了”。'],deck=[];
  $('pull').onclick=function(){
    if(!deck.length)deck=proms.slice().sort(function(){return Math.random()-.5});
    $('draw').textContent=deck.pop();
  };

  setInterval(spawn,1100);
})();
</script>
</body>
</html>
